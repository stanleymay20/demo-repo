name: AgentShield Assessment v19 OOF Stack

on:
  push:
    branches:
      - agentshield-assessment-v19-oof-stack
    paths:
      - 'agentshield/assessment_v19_oof_stack.py'
      - 'agentshield/ASSESSMENT_V19_OOF_STACK_PROTOCOL.md'
      - '.github/workflows/agentshield-assessment-v19-oof-stack.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install datasets pandas numpy scipy scikit-learn beautifulsoup4 lxml

      - name: Validate experiment source
        run: |
          python -m py_compile agentshield/assessment_v19_oof_stack.py
          test -s agentshield/ASSESSMENT_V19_OOF_STACK_PROTOCOL.md

      - name: Runtime manifest
        run: |
          mkdir -p agentshield/results
          {
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            python --version
            python - <<'PY'
          import platform, sklearn, datasets
          print('platform=' + platform.platform())
          print('sklearn=' + sklearn.__version__)
          print('datasets=' + datasets.__version__)
          PY
          } | tee agentshield/results/assessment_v19_runtime_manifest.txt

      - name: Run controlled v19 experiment
        shell: bash
        run: |
          set -o pipefail
          python -u agentshield/assessment_v19_oof_stack.py 2>&1 | tee agentshield/results/assessment_v19.log
          test -s agentshield/results/assessment_v19_validation.csv
          test -s agentshield/results/assessment_v19_evidence.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentshield-assessment-v19-evidence
          if-no-files-found: error
          path: |
            agentshield/ASSESSMENT_V19_OOF_STACK_PROTOCOL.md
            agentshield/assessment_v19_oof_stack.py
            agentshield/results/assessment_v19_runtime_manifest.txt
            agentshield/results/assessment_v19.log
            agentshield/results/assessment_v19_validation.csv
            agentshield/results/assessment_v19_evidence.json
