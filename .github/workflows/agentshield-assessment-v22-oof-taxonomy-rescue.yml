name: AgentShield Assessment v22 OOF Taxonomy Rescue — Infra Resume

on:
  push:
    branches:
      - agentshield-assessment-v22-oof-taxonomy-rescue-infra
    paths:
      - 'agentshield/assessment_v22_oof_taxonomy_rescue.py'
      - 'agentshield/assessment_v22_stage1_checkpoint.py'
      - 'agentshield/assessment_v22_stage2_resume.py'
      - 'agentshield/ASSESSMENT_V22_OOF_TAXONOMY_RESCUE_PROTOCOL.md'
      - 'agentshield/ASSESSMENT_V22_INFRA_REPAIR.md'
      - '.github/workflows/agentshield-assessment-v22-oof-taxonomy-rescue.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install datasets pandas numpy scipy scikit-learn beautifulsoup4 lxml torch transformers huggingface_hub

      - name: Validate frozen source and resume scripts
        run: |
          python -m py_compile agentshield/assessment_v22_oof_taxonomy_rescue.py
          python -m py_compile agentshield/assessment_v22_stage1_checkpoint.py
          python -m py_compile agentshield/assessment_v22_stage2_resume.py
          test -s agentshield/ASSESSMENT_V22_OOF_TAXONOMY_RESCUE_PROTOCOL.md
          test -s agentshield/ASSESSMENT_V22_INFRA_REPAIR.md
          test -s agentshield/assessment_v16_hard_rescue.py
          test -s agentshield/assessment_v17_oof_adversarial.py

      - name: Runtime manifest
        run: |
          mkdir -p agentshield/results
          {
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "stage=checkpoint"
            python --version
            python - <<'PY'
          import platform, sklearn, datasets
          print('platform=' + platform.platform())
          print('sklearn=' + sklearn.__version__)
          print('datasets=' + datasets.__version__)
          PY
          } | tee agentshield/results/assessment_v22_stage1_runtime_manifest.txt

      - name: Run frozen v22 through anchor checkpoint
        shell: bash
        run: |
          set -o pipefail
          python -u agentshield/assessment_v22_stage1_checkpoint.py 2>&1 | tee agentshield/results/assessment_v22_stage1.log
          test -s agentshield/results/v22_stage1_checkpoint.joblib
          test -s agentshield/results/v22_stage1_checkpoint_manifest.json

      - name: Upload stage-one checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: agentshield-v22-stage1-checkpoint
          if-no-files-found: error
          retention-days: 7
          path: |
            agentshield/results/v22_stage1_checkpoint.joblib
            agentshield/results/v22_stage1_checkpoint_manifest.json
            agentshield/results/assessment_v22_stage1_runtime_manifest.txt
            agentshield/results/assessment_v22_stage1.log

  resume:
    needs: checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install datasets pandas numpy scipy scikit-learn beautifulsoup4 lxml torch transformers huggingface_hub

      - name: Validate frozen source and resume scripts
        run: |
          python -m py_compile agentshield/assessment_v22_oof_taxonomy_rescue.py
          python -m py_compile agentshield/assessment_v22_stage1_checkpoint.py
          python -m py_compile agentshield/assessment_v22_stage2_resume.py
          test -s agentshield/ASSESSMENT_V22_OOF_TAXONOMY_RESCUE_PROTOCOL.md
          test -s agentshield/ASSESSMENT_V22_INFRA_REPAIR.md

      - name: Download verified checkpoint transport
        uses: actions/download-artifact@v4
        with:
          name: agentshield-v22-stage1-checkpoint
          path: agentshield/results

      - name: Runtime manifest
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "stage=resume"
            python --version
            python - <<'PY'
          import platform, sklearn, datasets
          print('platform=' + platform.platform())
          print('sklearn=' + sklearn.__version__)
          print('datasets=' + datasets.__version__)
          PY
          } | tee agentshield/results/assessment_v22_stage2_runtime_manifest.txt

      - name: Resume frozen v22 specialists validation and audit
        shell: bash
        run: |
          set -o pipefail
          python -u agentshield/assessment_v22_stage2_resume.py 2>&1 | tee agentshield/results/assessment_v22.log
          test -s agentshield/results/assessment_v22_validation.csv
          test -s agentshield/results/assessment_v22_evidence.json
          test -s agentshield/results/v22_stage2_resume_manifest.json

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentshield-assessment-v22-evidence
          if-no-files-found: error
          path: |
            agentshield/ASSESSMENT_V22_OOF_TAXONOMY_RESCUE_PROTOCOL.md
            agentshield/ASSESSMENT_V22_INFRA_REPAIR.md
            agentshield/assessment_v22_oof_taxonomy_rescue.py
            agentshield/assessment_v22_stage1_checkpoint.py
            agentshield/assessment_v22_stage2_resume.py
            agentshield/results/v22_stage1_checkpoint_manifest.json
            agentshield/results/assessment_v22_stage2_runtime_manifest.txt
            agentshield/results/assessment_v22.log
            agentshield/results/assessment_v22_validation.csv
            agentshield/results/assessment_v22_evidence.json
            agentshield/results/v22_stage2_resume_manifest.json
