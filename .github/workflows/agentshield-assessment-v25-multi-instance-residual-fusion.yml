name: AgentShield Assessment v25 Multi-Instance Residual Fusion

on:
  push:
    branches:
      - agentshield-assessment-v25-multi-instance-residual-fusion
    paths:
      - 'agentshield/ASSESSMENT_V25_MULTI_INSTANCE_RESIDUAL_FUSION_PROTOCOL.md'
      - 'agentshield/assessment_v25_multi_instance_residual_fusion.py'
      - '.github/workflows/agentshield-assessment-v25-multi-instance-residual-fusion.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '42'
  TOKENIZERS_PARALLELISM: 'false'

jobs:
  prepare-development:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install datasets==5.0.1 pandas==3.0.5 numpy==2.4.6 scipy==1.17.1 scikit-learn==1.9.1 beautifulsoup4==4.15.0 lxml==6.1.3 torch==2.14.0 transformers==5.17.0 huggingface_hub==1.31.0 joblib==1.6.0 safetensors==0.8.0

      - name: Validate frozen source
        run: |
          python -m py_compile agentshield/assessment_v25_multi_instance_residual_fusion.py
          test -s agentshield/ASSESSMENT_V25_MULTI_INSTANCE_RESIDUAL_FUSION_PROTOCOL.md
          test -s agentshield/assessment_v16_hard_rescue.py
          test -s agentshield/assessment_v17_oof_adversarial.py

      - name: Runtime manifest
        run: |
          mkdir -p agentshield/results agentshield/v25_stage1
          {
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            python --version
            python - <<'PY'
          import platform, numpy, pandas, scipy, sklearn, datasets, torch, transformers, huggingface_hub
          print('platform=' + platform.platform())
          print('numpy=' + numpy.__version__)
          print('pandas=' + pandas.__version__)
          print('scipy=' + scipy.__version__)
          print('sklearn=' + sklearn.__version__)
          print('datasets=' + datasets.__version__)
          print('torch=' + torch.__version__)
          print('transformers=' + transformers.__version__)
          print('huggingface_hub=' + huggingface_hub.__version__)
          PY
          } | tee agentshield/results/assessment_v25_stage1_runtime.txt

      - name: Prepare development state and OOF residual masks
        shell: bash
        run: |
          set -o pipefail
          python -u agentshield/assessment_v25_multi_instance_residual_fusion.py stage1 --out agentshield/v25_stage1 2>&1 | tee agentshield/results/assessment_v25_stage1.log
          test -s agentshield/v25_stage1/MANIFEST.json
          test -s agentshield/v25_stage1/meta.json
          test -s agentshield/v25_stage1/arrays.npz
          cp agentshield/results/assessment_v25_stage1_runtime.txt agentshield/v25_stage1/
          cp agentshield/results/assessment_v25_stage1.log agentshield/v25_stage1/

      - name: Upload stage-one checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentshield-v25-stage1
          if-no-files-found: warn
          retention-days: 7
          path: agentshield/v25_stage1/

  train-multi-instance:
    needs: prepare-development
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install datasets==5.0.1 pandas==3.0.5 numpy==2.4.6 scipy==1.17.1 scikit-learn==1.9.1 beautifulsoup4==4.15.0 lxml==6.1.3 torch==2.14.0 transformers==5.17.0 huggingface_hub==1.31.0 joblib==1.6.0 safetensors==0.8.0

      - name: Validate frozen source
        run: |
          python -m py_compile agentshield/assessment_v25_multi_instance_residual_fusion.py
          test -s agentshield/ASSESSMENT_V25_MULTI_INSTANCE_RESIDUAL_FUSION_PROTOCOL.md

      - name: Download stage-one checkpoint
        uses: actions/download-artifact@v4
        with:
          name: agentshield-v25-stage1
          path: agentshield/v25_stage1

      - name: Runtime manifest
        run: |
          mkdir -p agentshield/results agentshield/v25_stage2
          {
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            python --version
            python - <<'PY'
          import platform, torch, transformers
          print('platform=' + platform.platform())
          print('torch=' + torch.__version__)
          print('transformers=' + transformers.__version__)
          PY
          } | tee agentshield/results/assessment_v25_stage2_runtime.txt

      - name: Train six-view document-level ELECTRA specialist
        shell: bash
        run: |
          set -o pipefail
          python -u agentshield/assessment_v25_multi_instance_residual_fusion.py stage2 --stage1 agentshield/v25_stage1 --out agentshield/v25_stage2 2>&1 | tee agentshield/results/assessment_v25_stage2.log
          test -s agentshield/v25_stage2/MANIFEST.json
          test -s agentshield/v25_stage2/multi_instance_val.npy
          test -d agentshield/v25_stage2/model
          cp agentshield/results/assessment_v25_stage2_runtime.txt agentshield/v25_stage2/
          cp agentshield/results/assessment_v25_stage2.log agentshield/v25_stage2/

      - name: Upload trained specialist checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentshield-v25-stage2
          if-no-files-found: warn
          retention-days: 7
          path: agentshield/v25_stage2/

  freeze-candidate:
    needs: train-multi-instance
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install datasets==5.0.1 pandas==3.0.5 numpy==2.4.6 scipy==1.17.1 scikit-learn==1.9.1 beautifulsoup4==4.15.0 lxml==6.1.3 torch==2.14.0 transformers==5.17.0 huggingface_hub==1.31.0 joblib==1.6.0 safetensors==0.8.0

      - name: Validate frozen source
        run: |
          python -m py_compile agentshield/assessment_v25_multi_instance_residual_fusion.py
          test -s agentshield/ASSESSMENT_V25_MULTI_INSTANCE_RESIDUAL_FUSION_PROTOCOL.md

      - name: Download stage-one checkpoint
        uses: actions/download-artifact@v4
        with:
          name: agentshield-v25-stage1
          path: agentshield/v25_stage1

      - name: Download trained specialist checkpoint
        uses: actions/download-artifact@v4
        with:
          name: agentshield-v25-stage2
          path: agentshield/v25_stage2

      - name: Runtime manifest
        run: |
          mkdir -p agentshield/results agentshield/v25_stage3
          {
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            python --version
          } | tee agentshield/results/assessment_v25_stage3_runtime.txt

      - name: Select validation winner and freeze exact candidate bundle
        shell: bash
        run: |
          set -o pipefail
          python -u agentshield/assessment_v25_multi_instance_residual_fusion.py stage3 --stage1 agentshield/v25_stage1 --stage2 agentshield/v25_stage2 --out agentshield/v25_stage3 2>&1 | tee agentshield/results/assessment_v25_stage3.log
          test -s agentshield/v25_stage3/STAGE3_MANIFEST.json
          test -s agentshield/v25_stage3/meta.json
          test -s agentshield/v25_stage3/assessment_v25_validation.csv
          test -s agentshield/v25_stage3/assessment_v25_validation_winner.json
          test -s agentshield/v25_stage3/candidate_bundle/MANIFEST.json
          test -s agentshield/v25_stage3/candidate_bundle/system.json
          cp agentshield/results/assessment_v25_stage3_runtime.txt agentshield/v25_stage3/
          cp agentshield/results/assessment_v25_stage3.log agentshield/v25_stage3/

      - name: Upload frozen candidate checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentshield-v25-stage3-frozen-candidate
          if-no-files-found: error
          retention-days: 90
          path: agentshield/v25_stage3/

  audit-frozen-candidate:
    needs: freeze-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install datasets==5.0.1 pandas==3.0.5 numpy==2.4.6 scipy==1.17.1 scikit-learn==1.9.1 beautifulsoup4==4.15.0 lxml==6.1.3 torch==2.14.0 transformers==5.17.0 huggingface_hub==1.31.0 joblib==1.6.0 safetensors==0.8.0

      - name: Validate frozen source
        run: |
          python -m py_compile agentshield/assessment_v25_multi_instance_residual_fusion.py
          test -s agentshield/ASSESSMENT_V25_MULTI_INSTANCE_RESIDUAL_FUSION_PROTOCOL.md

      - name: Download stage-one checkpoint
        uses: actions/download-artifact@v4
        with:
          name: agentshield-v25-stage1
          path: agentshield/v25_stage1

      - name: Download trained specialist checkpoint
        uses: actions/download-artifact@v4
        with:
          name: agentshield-v25-stage2
          path: agentshield/v25_stage2

      - name: Download frozen candidate checkpoint
        uses: actions/download-artifact@v4
        with:
          name: agentshield-v25-stage3-frozen-candidate
          path: agentshield/v25_stage3

      - name: Runtime manifest
        run: |
          mkdir -p agentshield/results
          {
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            python --version
            python - <<'PY'
          import platform, torch, transformers
          print('platform=' + platform.platform())
          print('torch=' + torch.__version__)
          print('transformers=' + transformers.__version__)
          PY
          } | tee agentshield/results/assessment_v25_stage4_runtime.txt

      - name: Verify frozen bundle and conditionally score comparative audit
        shell: bash
        run: |
          set -o pipefail
          python -u agentshield/assessment_v25_multi_instance_residual_fusion.py stage4 --stage1 agentshield/v25_stage1 --stage2 agentshield/v25_stage2 --stage3 agentshield/v25_stage3 --results agentshield/results 2>&1 | tee agentshield/results/assessment_v25.log
          test -s agentshield/results/assessment_v25_evidence.json
          test -s agentshield/results/assessment_v25_validation.csv
          test -s agentshield/results/assessment_v25_validation_winner.json

      - name: Upload final evidence and exact frozen candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentshield-assessment-v25-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            agentshield/ASSESSMENT_V25_MULTI_INSTANCE_RESIDUAL_FUSION_PROTOCOL.md
            agentshield/assessment_v25_multi_instance_residual_fusion.py
            .github/workflows/agentshield-assessment-v25-multi-instance-residual-fusion.yml
            agentshield/results/assessment_v25_stage4_runtime.txt
            agentshield/results/assessment_v25.log
            agentshield/results/assessment_v25_evidence.json
            agentshield/results/assessment_v25_validation.csv
            agentshield/results/assessment_v25_validation_winner.json
            agentshield/results/assessment_v25_stage3_meta.json
            agentshield/results/assessment_v25_candidate_bundle_MANIFEST.json
            agentshield/v25_stage3/candidate_bundle/
