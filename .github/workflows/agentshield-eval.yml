name: AgentShield frozen final test

on:
  push:
    branches: [agentshield-eval-v11]
    paths:
      - 'agentshield/**'
      - '.github/workflows/agentshield-eval.yml'

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy<3' pandas pyarrow datasets beautifulsoup4 lxml scikit-learn
      - name: Run frozen AgentShield official test
        run: python agentshield/agentshield_final_test.py
      - name: Upload final test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentshield-final-test-results
          path: agentshield_final_test_results.json
          if-no-files-found: warn
