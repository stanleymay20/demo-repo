name: AgentShield contextual evaluation

on:
  push:
    branches: [agentshield-eval-v11]
    paths:
      - 'agentshield/**'
      - '.github/workflows/agentshield-eval.yml'

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy<3' pandas pyarrow datasets beautifulsoup4 lxml scikit-learn sentence-transformers torch
      - name: Run AgentShield evaluation
        run: python agentshield/agentshield_eval.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentshield-results
          path: agentshield_results.json
          if-no-files-found: warn
