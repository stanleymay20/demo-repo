name: AgentShield ModernBERT label audit

on:
  push:
    branches: [agentshield-high-recall-research]
    paths:
      - 'agentshield/modernbert_label_audit.py'
      - '.github/workflows/agentshield-modernbert-label-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install transformers huggingface_hub
      - name: Verify label semantics
        run: |
          python agentshield/modernbert_label_audit.py | tee agentshield/modernbert_label_audit.log
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentshield-modernbert-label-audit
          path: agentshield/modernbert_label_audit.log
          if-no-files-found: error
