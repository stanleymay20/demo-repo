name: AgentShield Release Evidence

on:
  push:
    tags:
      - 'agentshield-v*'

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  release-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Build exact wheel
        run: |
          python -m pip install --upgrade pip
          mkdir -p dist
          python -m pip wheel . --no-deps --wheel-dir dist
          sha256sum dist/*.whl | tee dist/SHA256SUMS
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          output-file: dist/agentshield-sbom.spdx.json
      - name: Attest wheel provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: 'dist/*.whl'
      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agentshield-release-evidence-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 90
          path: |
            dist/*.whl
            dist/SHA256SUMS
            dist/agentshield-sbom.spdx.json
