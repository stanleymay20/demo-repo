name: AgentShield v18 External Validation

on:
  push:
    branches:
      - agentshield-v18-external-validation
    paths:
      - 'agentshield/V18_EXTERNAL_VALIDATION_PROTOCOL.md'
      - 'agentshield/V18_EXTERNAL_VALIDATION_INFRA_REPAIR.md'
      - 'agentshield/v18_external_validation.py'
      - '.github/workflows/agentshield-v18-external-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TOKENIZERS_PARALLELISM: 'false'

jobs:
  predict-and-seal:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install datasets==5.0.1 pandas==3.0.5 numpy==2.4.6 scipy==1.17.1 scikit-learn==1.9.1 beautifulsoup4==4.15.0 lxml==6.1.3 torch==2.14.0 transformers==5.17.0 huggingface_hub==1.31.0 requests==2.34.2

      - name: Validate frozen sources
        run: |
          python -m py_compile agentshield/v18_external_validation.py
          test -s agentshield/V18_EXTERNAL_VALIDATION_PROTOCOL.md
          test -s agentshield/V18_EXTERNAL_VALIDATION_INFRA_REPAIR.md
          test -s agentshield/assessment_v18_fpr_stable.py
          test -s agentshield/assessment_v17_oof_adversarial.py
          test -s agentshield/assessment_v16_hard_rescue.py

      - name: Runtime manifest
        run: |
          mkdir -p agentshield/results/v18_external_stage1
          {
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "PYTHONHASHSEED=${PYTHONHASHSEED-<unset>}"
            python --version
            python - <<'PY'
          import platform, numpy, pandas, scipy, sklearn, datasets, torch, transformers, huggingface_hub
          print('platform=' + platform.platform())
          print('numpy=' + numpy.__version__)
          print('pandas=' + pandas.__version__)
          print('scipy=' + scipy.__version__)
          print('sklearn=' + sklearn.__version__)
          print('datasets=' + datasets.__version__)
          print('torch=' + torch.__version__)
          print('transformers=' + transformers.__version__)
          print('huggingface_hub=' + huggingface_hub.__version__)
          PY
          } | tee agentshield/results/v18_external_stage1/runtime.txt

      - name: Reconstruct v18 predict and seal
        shell: bash
        run: |
          set -o pipefail
          python -u agentshield/v18_external_validation.py predict --out agentshield/results/v18_external_stage1 2>&1 | tee agentshield/results/v18_external_stage1/run.log
          test -s agentshield/results/v18_external_stage1/sealed_predictions.csv
          test -s agentshield/results/v18_external_stage1/stage1_manifest.json

      - name: Upload sealed prediction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentshield-v18-external-stage1
          if-no-files-found: warn
          retention-days: 90
          path: |
            agentshield/V18_EXTERNAL_VALIDATION_PROTOCOL.md
            agentshield/V18_EXTERNAL_VALIDATION_INFRA_REPAIR.md
            agentshield/v18_external_validation.py
            agentshield/results/v18_external_stage1/

  score-sealed-predictions:
    needs: predict-and-seal
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install datasets==5.0.1 pandas==3.0.5 numpy==2.4.6 scipy==1.17.1 scikit-learn==1.9.1 beautifulsoup4==4.15.0 lxml==6.1.3 torch==2.14.0 transformers==5.17.0 huggingface_hub==1.31.0 requests==2.34.2

      - name: Download sealed prediction evidence
        uses: actions/download-artifact@v4
        with:
          name: agentshield-v18-external-stage1
          path: downloaded_stage1

      - name: Locate sealed stage directory
        run: |
          find downloaded_stage1 -name sealed_predictions.csv -print
          STAGE_DIR="$(dirname "$(find downloaded_stage1 -name sealed_predictions.csv -print -quit)")"
          test -n "$STAGE_DIR"
          echo "STAGE_DIR=$STAGE_DIR" >> "$GITHUB_ENV"

      - name: Runtime manifest
        run: |
          mkdir -p agentshield/results/v18_external_final
          {
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "stage_dir=${STAGE_DIR}"
            echo "PYTHONHASHSEED=${PYTHONHASHSEED-<unset>}"
            python --version
          } | tee agentshield/results/v18_external_final/runtime.txt

      - name: Verify seal then read labels and score
        shell: bash
        run: |
          set -o pipefail
          python -u agentshield/v18_external_validation.py score --stage1 "$STAGE_DIR" --out agentshield/results/v18_external_final 2>&1 | tee agentshield/results/v18_external_final/run.log
          test -s agentshield/results/v18_external_final/v18_external_validation_evidence.json

      - name: Upload final external-validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentshield-v18-external-validation-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            agentshield/V18_EXTERNAL_VALIDATION_PROTOCOL.md
            agentshield/V18_EXTERNAL_VALIDATION_INFRA_REPAIR.md
            agentshield/v18_external_validation.py
            .github/workflows/agentshield-v18-external-validation.yml
            agentshield/results/v18_external_final/
