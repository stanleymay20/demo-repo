name: AgentShield v26 Development-Only Residual Forensics

on:
  push:
    branches:
      - agentshield-v26-residual-forensics
    paths:
      - 'agentshield/AGENTSHIELD_V26_RESIDUAL_FORENSICS_PROTOCOL.md'
      - 'agentshield/agentshield_v26_residual_forensics.py'
      - '.github/workflows/agentshield-v26-residual-forensics.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '42'

jobs:
  residual-forensics:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout frozen v26 source
        uses: actions/checkout@v4

      - name: Set up controlled Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'

      - name: Install pinned diagnostic stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install datasets==5.0.1 pandas==3.0.5 numpy==2.4.6 scipy==1.17.1 scikit-learn==1.9.1 beautifulsoup4==4.15.0 lxml==6.1.3 pyarrow joblib

      - name: Static validation
        run: |
          python -m py_compile agentshield/agentshield_v26_residual_forensics.py
          test -s agentshield/AGENTSHIELD_V26_RESIDUAL_FORENSICS_PROTOCOL.md
          test -s agentshield/assessment_v16_hard_rescue.py

      - name: Runtime manifest
        run: |
          mkdir -p agentshield/results
          {
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            python --version
            python - <<'PY'
          import platform, numpy, pandas, scipy, sklearn, datasets, pyarrow
          print('platform=' + platform.platform())
          print('numpy=' + numpy.__version__)
          print('pandas=' + pandas.__version__)
          print('scipy=' + scipy.__version__)
          print('sklearn=' + sklearn.__version__)
          print('datasets=' + datasets.__version__)
          print('pyarrow=' + pyarrow.__version__)
          PY
          } | tee agentshield/results/v26_runtime.txt

      - name: Run development-only OOF residual forensics
        shell: bash
        run: |
          set -o pipefail
          python -u agentshield/agentshield_v26_residual_forensics.py 2>&1 | tee agentshield/results/v26_run.log
          test -s agentshield/results/v26_residual_rows.csv
          test -s agentshield/results/v26_slice_summary.csv
          test -s agentshield/results/v26_evidence.json
          python - <<'PY'
          import json
          p=json.load(open('agentshield/results/v26_evidence.json'))
          c=p['controls']
          assert c['comparative_audit_accessed'] is False
          assert c['benchmark_labels_accessed'] is False
          assert c['external_validation_datasets_accessed'] is False
          assert c['submitted_assessment_modified'] is False
          assert p['oof']['fpr'] <= 0.006 + 1e-15
          print('V26 FIREWALL AND FPR GATES PASS')
          PY

      - name: Upload v26 forensic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentshield-v26-residual-forensics-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            agentshield/AGENTSHIELD_V26_RESIDUAL_FORENSICS_PROTOCOL.md
            agentshield/agentshield_v26_residual_forensics.py
            agentshield/results/v26_runtime.txt
            agentshield/results/v26_run.log
            agentshield/results/v26_residual_rows.csv
            agentshield/results/v26_slice_summary.csv
            agentshield/results/v26_evidence.json
