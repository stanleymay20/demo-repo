name: AgentShield v27 Targeted Long-Context Unicode Rescue

on:
  push:
    branches:
      - agentshield-v27-targeted-rescue
    paths:
      - 'agentshield/AGENTSHIELD_V27_TARGETED_RESCUE_PROTOCOL.md'
      - 'agentshield/agentshield_v27_targeted_rescue.py'
      - '.github/workflows/agentshield-v27-targeted-rescue.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '42'

jobs:
  freeze-validation-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout frozen v27 source
        uses: actions/checkout@v4

      - name: Set up controlled Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'

      - name: Install pinned research stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install datasets==5.0.1 pandas==3.0.5 numpy==2.4.6 scipy==1.17.1 scikit-learn==1.9.1 beautifulsoup4==4.15.0 lxml==6.1.3 pyarrow==25.0.1 joblib==1.6.0

      - name: Static validation
        run: |
          python -m py_compile agentshield/agentshield_v27_targeted_rescue.py
          test -s agentshield/AGENTSHIELD_V27_TARGETED_RESCUE_PROTOCOL.md
          test -s agentshield/agentshield_v27_targeted_rescue.py

      - name: Runtime manifest
        run: |
          mkdir -p agentshield/results agentshield/v27_stage1
          {
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            python --version
            python - <<'PY'
          import platform, numpy, pandas, scipy, sklearn, datasets, pyarrow, joblib
          print('platform=' + platform.platform())
          print('numpy=' + numpy.__version__)
          print('pandas=' + pandas.__version__)
          print('scipy=' + scipy.__version__)
          print('sklearn=' + sklearn.__version__)
          print('datasets=' + datasets.__version__)
          print('pyarrow=' + pyarrow.__version__)
          print('joblib=' + joblib.__version__)
          PY
          } | tee agentshield/results/v27_stage1_runtime.txt

      - name: Train, validate, promote-gate, and freeze exact candidate
        shell: bash
        run: |
          set -o pipefail
          python -u agentshield/agentshield_v27_targeted_rescue.py stage1 --out agentshield/v27_stage1 2>&1 | tee agentshield/results/v27_stage1.log
          test -s agentshield/v27_stage1/STAGE1_MANIFEST.json
          test -s agentshield/v27_stage1/v27_stage1_meta.json
          test -s agentshield/v27_stage1/v27_validation_systems.csv
          test -s agentshield/v27_stage1/v27_validation_winner.json
          test -s agentshield/v27_stage1/candidate_bundle/MANIFEST.json
          test -s agentshield/v27_stage1/candidate_bundle/system.json
          cp agentshield/results/v27_stage1_runtime.txt agentshield/v27_stage1/
          cp agentshield/results/v27_stage1.log agentshield/v27_stage1/

      - name: Verify frozen stage-one controls
        run: |
          python - <<'PY'
          import json
          p=json.load(open('agentshield/v27_stage1/v27_stage1_meta.json'))
          c=p['controls']
          assert c['comparative_audit_examples_materialized'] is False
          assert c['comparative_audit_scored'] is False
          assert c['comparative_audit_examples_inspected'] is False
          assert c['comparative_audit_labels_used_for_redesign'] is False
          assert c['benchmark_labels_accessed'] is False
          assert c['external_validation_datasets_accessed'] is False
          assert c['submitted_assessment_modified'] is False
          assert p['development_oof']['strict_fold_local_feature_fit'] is True
          assert p['development_oof']['fpr'] <= 0.006 + 1e-15
          print('V27 STAGE1 FIREWALL AND STRICT-OOF GATES PASS')
          PY

      - name: Upload frozen v27 candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentshield-v27-frozen-candidate
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
          path: |
            agentshield/AGENTSHIELD_V27_TARGETED_RESCUE_PROTOCOL.md
            agentshield/agentshield_v27_targeted_rescue.py
            .github/workflows/agentshield-v27-targeted-rescue.yml
            agentshield/v27_stage1/

  conditional-comparative-audit:
    needs: freeze-validation-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout exact v27 source
        uses: actions/checkout@v4

      - name: Set up controlled Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'

      - name: Install pinned research stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install datasets==5.0.1 pandas==3.0.5 numpy==2.4.6 scipy==1.17.1 scikit-learn==1.9.1 beautifulsoup4==4.15.0 lxml==6.1.3 pyarrow==25.0.1 joblib==1.6.0

      - name: Static validation
        run: |
          python -m py_compile agentshield/agentshield_v27_targeted_rescue.py
          test -s agentshield/AGENTSHIELD_V27_TARGETED_RESCUE_PROTOCOL.md

      - name: Download exact frozen candidate
        uses: actions/download-artifact@v4
        with:
          name: agentshield-v27-frozen-candidate
          path: agentshield/v27_download

      - name: Locate frozen stage-one root
        shell: bash
        run: |
          set -e
          find agentshield/v27_download -maxdepth 4 -type f -name STAGE1_MANIFEST.json -print
          ROOT="$(dirname "$(find agentshield/v27_download -maxdepth 4 -type f -name STAGE1_MANIFEST.json | head -n 1)")"
          test -n "$ROOT"
          echo "STAGE1_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Runtime manifest
        run: |
          mkdir -p agentshield/results
          {
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            python --version
          } | tee agentshield/results/v27_stage2_runtime.txt

      - name: Verify frozen bundle and conditionally score comparative audit
        shell: bash
        run: |
          set -o pipefail
          python -u agentshield/agentshield_v27_targeted_rescue.py stage2 --stage1 "$STAGE1_ROOT" --results agentshield/results 2>&1 | tee agentshield/results/v27_stage2.log
          test -s agentshield/results/v27_evidence.json

      - name: Verify no external-validation access
        run: |
          python - <<'PY'
          import json
          p=json.load(open('agentshield/results/v27_evidence.json'))
          c=p['controls']
          assert c['benchmark_labels_accessed'] is False
          assert c['external_validation_datasets_accessed'] is False
          assert c['submitted_assessment_modified'] is False
          if p.get('promotion_gate_passed'):
              assert c['audit_is_pristine'] is False
              assert c['comparative_audit_examples_inspected_for_redesign'] is False
          else:
              assert p['comparative_audit_scored'] is False
              assert p['comparative_audit_examples_materialized'] is False
          print('V27 FINAL FIREWALL GATES PASS')
          PY

      - name: Upload final v27 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentshield-v27-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            agentshield/AGENTSHIELD_V27_TARGETED_RESCUE_PROTOCOL.md
            agentshield/agentshield_v27_targeted_rescue.py
            .github/workflows/agentshield-v27-targeted-rescue.yml
            agentshield/results/v27_stage2_runtime.txt
            agentshield/results/v27_stage2.log
            agentshield/results/v27_evidence.json
