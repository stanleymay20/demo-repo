[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshield-runtime"
version = "0.1.0"
description = "Fail-closed runtime governance primitives for AI agent tool execution"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "AgentShield contributors"}]
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.3.6"]

[tool.setuptools.packages.find]
include = ["agentshield*"]
